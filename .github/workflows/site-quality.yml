name: Site quality and security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CSP, safe content, local resources, JavaScript, data integrity, and budgets
        run: python3 .github/scripts/check_site.py

      - name: Test the browser security parser and URL controls
        run: node .github/scripts/test_security.cjs

      - name: Test source-audit input, redirect, credential, and atomic-write controls
        run: python3 -m unittest discover -s teaching/tests -p test_source_audit_security.py -v

      - name: Test daily-maintenance validation and publication inputs
        run: python3 -m unittest discover -s teaching/tests -p test_maintenance.py -v

      - name: Validate the source registry without network refresh
        run: python3 teaching/tools/audit_sources.py

      - name: Check for exposed high-risk secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
