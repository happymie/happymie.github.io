name: Build approved public ResNet demonstration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-model.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official export dependencies
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 onnx==1.18.0 --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Export official ImageNet weights and intermediate activations
        run: |
          python - <<'PY'
          """Export official pretrained ResNet-18; no random or synthetic prediction weights."""
          from pathlib import Path
          import hashlib, json, platform
          import torch
          import onnx
          from torchvision.models import resnet18, ResNet18_Weights
          
          output=Path('biomed-ai-atlas/inference')
          output.mkdir(parents=True,exist_ok=True)
          torch.set_num_threads(1)
          weights=ResNet18_Weights.IMAGENET1K_V1
          model=resnet18(weights=weights).eval()
          class InspectableResNet(torch.nn.Module):
              def __init__(self,model):
                  super().__init__();self.model=model
              def forward(self,x):
                  m=self.model
                  x=m.maxpool(m.relu(m.bn1(m.conv1(x))))
                  early=m.layer1(x)
                  deep=m.layer4(m.layer3(m.layer2(early)))
                  logits=m.fc(torch.flatten(m.avgpool(deep),1))
                  return logits,early,deep
          wrapper=InspectableResNet(model).eval()
          sample=torch.zeros(1,3,224,224)
          target=output/'resnet18-imagenet.onnx'
          with torch.no_grad():
              torch.onnx.export(wrapper,sample,str(target),input_names=['image'],output_names=['logits','layer1','layer4'],opset_version=17,dynamo=False)
          onnx.checker.check_model(str(target))
          manifest={'model':'ResNet-18','weights':'ResNet18_Weights.IMAGENET1K_V1','source':weights.url,'architecture':'https://arxiv.org/abs/1512.03385','exporter':{'torch':torch.__version__,'python':platform.python_version(),'opset':17},'sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'bytes':target.stat().st_size,'input':{'shape':[1,3,224,224],'resize_short_side':256,'center_crop':224,'rgb':True,'mean':[0.485,0.456,0.406],'std':[0.229,0.224,0.225]},'outputs':{'logits':[1,1000],'layer1':[1,64,56,56],'layer4':[1,512,7,7]},'categories':weights.meta['categories'],'boundary':'Pretrained ImageNet classifier. Not a medical model or clinical diagnosis tool. Feature maps are activations, not causal explanations.'}
          (output/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in manifest.items() if k!='categories'},indent=2))
          PY
          curl --fail --location https://raw.githubusercontent.com/pytorch/hub/master/images/dog.jpg --output biomed-ai-atlas/inference/sample-dog.jpg
      - name: Install pinned public WASM runtime
        run: |
          mkdir -p biomed-ai-atlas/runtime
          npm install --prefix "$RUNNER_TEMP/atlas-ort" onnxruntime-web@1.22.0 --ignore-scripts --no-audit
          cp "$RUNNER_TEMP/atlas-ort/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm" biomed-ai-atlas/runtime/
          cp "$RUNNER_TEMP/atlas-ort/node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs" biomed-ai-atlas/runtime/
      - name: Commit approved public resources
        run: |
          git config user.name "Atlas publication"
          git config user.email "actions@users.noreply.github.com"
          git add biomed-ai-atlas/inference biomed-ai-atlas/runtime
          git diff --cached --quiet && exit 0
          git commit -m "Publish official ResNet-18 browser experiment resources"
          git push origin HEAD:main
