[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomed-atlas-lab"
version = "0.1.0"
description = "Source-backed biomedical AI teaching experiments with explicit reproduction boundaries"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT for original teaching code; third-party components retain their own licenses"}
dependencies = ["numpy==1.26.4", "torch==2.5.1", "torchvision==0.20.1", "monai==1.4.0", "timm==1.0.11", "einops==0.8.0", "torch-geometric==2.6.1", "fastmri==0.3.0", "huggingface-hub==0.26.5", "psutil>=5.9,<8", "scipy==1.14.1", "scikit-image==0.24.0", "tifffile==2024.12.12", "h5py==3.12.1", "torchmetrics==1.6.0", "pytorch-lightning==2.4.0", "ml-collections==0.1.1", "transformers==4.46.3"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
biomed-lab = "biomed_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["biomed_lab*", "vendor*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"*" = ["LICENSE", "LICENSE*", "PROVENANCE.json"]
