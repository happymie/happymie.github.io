<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
  <title id="title">PhyDiCT source-study map</title>
  <desc id="desc">Original teaching schematic: sparse X-rays and calibrated geometry constrain a frozen text-conditioned diffusion prior. Alternating observation guidance and denoising produces a candidate CT, followed by optional refinement. This is not the paper's original figure or a reconstruction result.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1c29"/><stop offset="1" stop-color="#122f35"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#74bfc5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="920" height="600" rx="20" fill="url(#bg)"/>
  <g font-family="system-ui, sans-serif" fill="#eff8fb">
    <text x="42" y="48" font-size="12" letter-spacing="3" fill="#7bc7cc">PHYDICT / SOURCE STUDY</text>
    <text x="42" y="91" font-size="29" font-weight="600">Observations guide a 3D prior.</text>
    <text x="42" y="124" font-size="15" fill="#a6bec6">Method outline · original teaching schematic · no model output shown</text>
    <g fill="#163440" stroke="#37616b">
      <rect x="42" y="167" width="386" height="96" rx="12"/>
      <rect x="492" y="167" width="386" height="96" rx="12"/>
      <rect x="42" y="314" width="386" height="111" rx="12"/>
      <rect x="492" y="314" width="386" height="111" rx="12"/>
      <rect x="272" y="476" width="376" height="80" rx="12"/>
    </g>
    <text x="66" y="200" font-size="18" font-weight="600">Sparse X-rays + geometry</text>
    <text x="66" y="233" font-size="14" fill="#adc5cb">Observed projections and acquisition poses</text>
    <text x="516" y="200" font-size="18" font-weight="600">Report + frozen MedSyn prior</text>
    <text x="516" y="233" font-size="14" fill="#adc5cb">Pretrained knowledge is an explicit input</text>
    <text x="66" y="350" font-size="18" font-weight="600">Projection consistency</text>
    <text x="66" y="380" font-size="14" fill="#adc5cb">Render the candidate volume</text>
    <text x="66" y="402" font-size="14" fill="#adc5cb">Compare it with the observations</text>
    <text x="516" y="350" font-size="18" font-weight="600">Guided diffusion sampling</text>
    <text x="516" y="380" font-size="14" fill="#adc5cb">Alternate prior and observation guidance</text>
    <text x="516" y="402" font-size="14" fill="#adc5cb">Optional re-noising and refinement</text>
    <text x="297" y="511" font-size="18" font-weight="600">Candidate lung CT volume</text>
    <text x="297" y="538" font-size="13" fill="#adc5cb">A plausible estimate still needs validation</text>
  </g>
  <g fill="none" stroke="#74bfc5" stroke-width="2" marker-end="url(#arrow)">
    <path d="M235 263V305"/><path d="M685 263V305"/>
    <path d="M428 357H482"/><path d="M492 392H438"/>
    <path d="M685 425V452H460V467"/>
  </g>
</svg>
